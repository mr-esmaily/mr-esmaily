<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>PWA Hello</title>

  <!-- Real manifest URL (same folder) -->
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- iOS install hints -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:#e5e7eb}
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    button{padding:12px 18px;border:0;border-radius:12px;font-size:16px;cursor:pointer;background:#22c55e;color:#0b1215}
    .toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none}
    .toast.show{display:flex;gap:10px;align-items:center}
    .toast button{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:6px 10px}
  </style>
</head>
<body>
  <main class="container">
    <h1>PWA Hello</h1>
    <button id="helloBtn">Show “Hello World”</button>
    <div id="toast" class="toast"><span>New version ready.</span><button id="refresh">Refresh</button></div>
  </main>

  <script>
    document.getElementById('helloBtn').addEventListener('click',()=>alert('Hello World bb👋'));

    if ('serviceWorker' in navigator) {
      // Register sw in SAME folder and scope
      navigator.serviceWorker.register('./sw.js', { scope: './' });

      // Auto-reload when new SW takes control
      navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());

      // Optional: periodic update checks
      navigator.serviceWorker.ready.then(reg => setInterval(()=>reg.update(), 60*60*1000));
    }

    // Simple update UI
    navigator.serviceWorker?.addEventListener('message', e => {
      if (e.data === 'SW_WAITING') {
        const t = document.getElementById('toast');
        t.classList.add('show');
        document.getElementById('refresh').onclick = () =>
          navigator.serviceWorker.controller?.postMessage('SKIP_WAITING');
      }
    });
  </script>
</body>
</html>
