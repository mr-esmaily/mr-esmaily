<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0f172a"/>
  <title>PWA Hello (Single File)</title>

  <!-- Inline manifest as a data URL -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name":"PWA Hello",
    "short_name":"Hello",
    "start_url":"./",
    "scope":"./",
    "display":"standalone",
    "background_color":"#0f172a",
    "theme_color":"#0f172a",
    "icons":[
      {"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAMAAABlApw1AAAA...","sizes":"192x192","type":"image/png"},
      {"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACA...","sizes":"512x512","type":"image/png"}
    ]
  }'>

  <style>
    html,body{height:100%;margin:0;font-family:sans-serif;background:#0f172a;color:#e5e7eb}
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    button{padding:12px 18px;border:0;border-radius:12px;font-size:16px;cursor:pointer;background:#22c55e;color:#0b1215}
  </style>
</head>
<body>
  <main class="container">
    <h1>PWA Hello (Single File)</h1>
    <button id="helloBtn">Show “Hello World”</button>
  </main>

  <script>
    document.getElementById('helloBtn').addEventListener('click',()=>alert('Hello World 👋'));

    // Inline service worker code as a Blob
    if ('serviceWorker' in navigator) {
      const swCode = `
        const APP_VERSION='v1';
        const CACHE='cache-'+APP_VERSION;
        const OFFLINE='<h1 style="font-family:sans-serif;text-align:center;margin-top:2em">You are offline</h1>';
        self.addEventListener('install',e=>{
          e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])).then(()=>self.skipWaiting()));
        });
        self.addEventListener('activate',e=>{
          e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>k!==CACHE&&caches.delete(k)))));
          self.clients.claim();
        });
        self.addEventListener('fetch',e=>{
          if(e.request.method!=='GET')return;
          e.respondWith(fetch(e.request).catch(()=>caches.match(e.request).then(r=>r||new Response(OFFLINE,{headers:{'Content-Type':'text/html'}}))));
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl);
    }
  </script>
</body>
</html>
